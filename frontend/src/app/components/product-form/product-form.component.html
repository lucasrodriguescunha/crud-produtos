<div class="page-header">
  <h1>{{ id ? 'Editar produto' : 'Novo produto' }}</h1>
</div>

<form class="card" (ngSubmit)="save()">
  <div class="form-field">
    <label for="name">Nome</label>
    <input type="text" id="name" [(ngModel)]="product.name" name="name" required />
  </div>

  <div class="form-field">
    <label for="description">Descrição</label>
    <input type="text" id="description" [(ngModel)]="product.description" name="description" />
  </div>

  <div class="form-field">
    <label for="price">Preço</label>
    <input type="number" id="price" [(ngModel)]="product.price" name="price" min="0" step="0.01" required />
  </div>

  <div class="form-field">
    <label for="quantity">Quantidade em estoque</label>
    <input type="number" id="quantity" [(ngModel)]="product.quantity" name="quantity" min="0" />
  </div>

  <div class="form-field form-field-check">
    <input type="checkbox" id="status" [(ngModel)]="product.status" name="status" />
    <label for="status">Produto ativo</label>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a routerLink="/" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
